<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BookingAgent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <button class="icon-btn" id="open-history" type="button" aria-controls="history" aria-label="Your conversations">☰</button>
      <div class="brand"><span class="logo" aria-hidden="true"></span><span>BookingAgent</span></div>
      <div class="top-actions">
        <button class="ghost-btn" id="new-chat" type="button">New chat</button>
        <button class="ghost-btn" id="open-profile" type="button" aria-controls="profile">Profile</button>
      </div>
    </header>

    <main class="conversation" id="conversation">
      <div class="thread" id="messages" aria-live="polite"></div>
    </main>

    <form class="composer" id="composer">
      <label class="sr-only" for="input">Message</label>
      <textarea id="input" rows="1" placeholder="Tell me what needs fixing, where and when" required></textarea>
      <button type="submit" id="send" aria-label="Send">Send</button>
    </form>
  </div>

  <aside class="drawer left" id="history" aria-label="Your conversations" hidden>
    <div class="drawer-head"><h2>Conversations</h2><button class="icon-btn" data-close type="button" aria-label="Close">✕</button></div>
    <ul class="history-list" id="session-list"></ul>
    <div class="who">
      <label for="user-id">Signed in as</label>
      <input id="user-id" autocomplete="off" spellcheck="false">
      <small>Demo sign-in. Each name has its own bookings and preferences.</small>
    </div>
  </aside>

  <aside class="drawer right" id="profile" aria-label="Your profile, bookings and memory" hidden>
    <div class="drawer-head"><h2>My profile</h2><button class="icon-btn" data-close type="button" aria-label="Close">✕</button></div>
    <div class="profile-form" id="profile-form"></div>
    <h2 class="sub">My bookings</h2>
    <ul class="bookings" id="bookings"></ul>
    <h2 class="sub">What I remember</h2>
    <p class="hint">I only use what you told me or confirmed. Edit or delete anything you like.</p>
    <ul class="memory" id="memory"></ul>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <script src="app.js" defer></script>
</body>
</html>
